name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false
      - run: uv pip install .
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.10"
          enable-cache: false
      - run: uv build
      - run: uvx --from dist/aclpubcheck-0.1-py3-none-any.whl aclpubcheck --help
      - run: uvx --from dist/aclpubcheck-0.1.tar.gz aclpubcheck --help
      - run: uvx --from . aclpubcheck --help
      - name: Tool install
        run: |
          uv tool install .
          "$(uv tool dir --bin)/aclpubcheck" --help
      - name: Editable install
        run: |
          uv venv /tmp/editable
          uv pip install --python /tmp/editable -e .
          /tmp/editable/bin/aclpubcheck --help
          /tmp/editable/bin/python -m aclpubcheck --help
